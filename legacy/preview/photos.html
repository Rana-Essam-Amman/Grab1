<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch the deals — Photos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f9f8f4; --card:#fff; --dark:#1a1918; --muted:#8c8982; --border:#e7e3d8; --accent:#b08931; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:#ebe6db; font-family: Tajawal, Inter, sans-serif; color:#4a4845; }
    .app { max-width:430px; min-height:100vh; margin:0 auto; background:var(--bg); padding:18px; }
    h1 { font-family: Newsreader, Georgia, serif; font-size:26px; color:var(--dark); margin: 16px 0 8px; }
    .sub { color:var(--muted); margin-bottom:18px; }
    .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .slot { height:100px; border:1px dashed var(--border); border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--muted); font-size:22px; }
    .slot img { width:100%; height:100%; object-fit:cover; }
    .cta { margin-top:22px; width:100%; height:52px; border:0; border-radius:26px; background:var(--accent); color:#fff; font-weight:700; }
    .cta:disabled { opacity:.45; }
    .err { color:#8B3A2A; margin-top:10px; font-size:13px; }
    a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="app">
    <a href="choose-sub.html">رجوع</a>
    <h1>أضف صور الإعلان</h1>
    <p class="sub">صورة واحدة على الأقل. الحد الأعلى 6 صور.</p>
    <input id="file" type="file" accept="image/*" multiple hidden />
    <div class="grid" id="grid"></div>
    <p class="err" id="err" hidden></p>
    <button class="cta" id="next" type="button" disabled>التالي</button>
  </div>
  <script>
    const MAX = 6, MIN = 1;
    const photos = [];
    const params = new URLSearchParams(location.search);
    const cat = params.get("cat") || "motors";
    const sub = params.get("sub") || "cars-sale";
    const grid = document.getElementById("grid");
    function draw() {
      grid.innerHTML = "";
      for (let i = 0; i < MAX; i++) {
        const el = document.createElement("label");
        el.className = "slot";
        if (photos[i]) { const img = document.createElement("img"); img.src = photos[i]; el.appendChild(img); }
        else el.textContent = "+";
        el.onclick = () => { if (photos.length < MAX) document.getElementById("file").click(); };
        grid.appendChild(el);
      }
      document.getElementById("next").disabled = photos.length < MIN;
    }
    document.getElementById("file").onchange = (e) => {
      const files = [...(e.target.files || [])];
      files.slice(0, MAX - photos.length).forEach(file => {
        const reader = new FileReader();
        reader.onload = () => { photos.push(reader.result); draw(); };
        reader.readAsDataURL(file);
      });
      e.target.value = "";
    };
    document.getElementById("next").onclick = () => {
      if (photos.length < MIN) { document.getElementById("err").hidden = false; document.getElementById("err").textContent = "أضف صورة واحدة على الأقل"; return; }
      location.href = "location.html?cat=" + encodeURIComponent(cat) + "&sub=" + encodeURIComponent(sub);
    };
    draw();
  </script>
</body>
</html>
