<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch the deals — Choose category</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f9f8f4; --card:#fff; --dark:#1a1918; --muted:#8c8982; --border:#e7e3d8; --accent:#b08931; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #ebe6db; font-family: Tajawal, Inter, sans-serif; color: #4a4845; }
    .app { max-width: 430px; min-height: 100vh; margin: 0 auto; background: var(--bg); padding: 18px 18px 40px; }
    a.close { color: var(--dark); text-decoration: none; font-size: 22px; }
    h1 { font-family: Newsreader, Georgia, serif; font-size: 26px; color: var(--dark); margin: 18px 0 8px; line-height: 1.3; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 14px; text-decoration: none; color: inherit; min-height: 150px; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 82px; object-fit: contain; }
    .card .name { margin-top: auto; font-weight: 700; color: var(--dark); display: flex; justify-content: space-between; }
    h2 { font-family: Newsreader, Georgia, serif; font-size: 22px; color: var(--dark); margin: 28px 0 8px; }
    .note { color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
    .row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; text-decoration: none; color: inherit; }
    .row img { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; }
    .row span { flex: 1; font-weight: 600; }
  </style>
</head>
<body>
  <div class="app">
    <a class="close" href="home.html">✕</a>
    <h1>ما الذي تود بيعه أو الإعلان عنه؟</h1>
    <p class="sub">اختر القسم المناسب لإضافة الإعلان</p>
    <div class="grid">
      <a class="card" href="choose-sub.html?cat=motors"><img src="assets/icons/motors.jpg" alt=""><div class="name">سيارات <span>‹</span></div></a>
      <a class="card" href="choose-sub.html?cat=real-estate"><img src="assets/icons/real-estate.jpg" alt=""><div class="name">عقارات <span>‹</span></div></a>
      <a class="card" href="choose-sub.html?cat=services"><img src="assets/icons/services.jpg" alt=""><div class="name">خدمات <span>‹</span></div></a>
      <a class="card" href="choose-sub.html?cat=jobs"><img src="assets/icons/jobs.jpg" alt=""><div class="name">وظائف <span>‹</span></div></a>
    </div>
    <h2>الأقسام الأخرى</h2>
    <p class="note">إذا المطلوب مش من الأربعة فوق، اختر من باقي أقسام Catch the deals.</p>
    <a class="row" href="choose-sub.html?cat=mobiles"><img src="assets/icons/mobiles.jpg" alt=""><span>موبايل</span>‹</a>
    <a class="row" href="choose-sub.html?cat=electronics"><img src="assets/icons/electronics.jpg" alt=""><span>أجهزة</span>‹</a>
    <a class="row" href="choose-sub.html?cat=furniture"><img src="assets/icons/furniture.jpg" alt=""><span>أثاث</span>‹</a>
    <a class="row" href="choose-sub.html?cat=fashion"><img src="assets/icons/fashion.jpg" alt=""><span>أزياء</span>‹</a>
    <a class="row" href="choose-sub.html?cat=computers"><img src="assets/icons/computers.jpg" alt=""><span>كمبيوتر</span>‹</a>
    <a class="row" href="choose-sub.html?cat=watches"><img src="assets/icons/watches.jpg" alt=""><span>ساعات</span>‹</a>
    <a class="row" href="choose-sub.html?cat=kids"><img src="assets/icons/kids.jpg" alt=""><span>أطفال</span>‹</a>
    <a class="row" href="choose-sub.html?cat=beauty"><img src="assets/icons/beauty.jpg" alt=""><span>جمال</span>‹</a>
    <a class="row" href="choose-sub.html?cat=pets"><img src="assets/icons/pets.jpg" alt=""><span>حيوانات</span>‹</a>
    <a class="row" href="choose-sub.html?cat=sports"><img src="assets/icons/sports.jpg" alt=""><span>رياضة</span>‹</a>
    <a class="row" href="choose-sub.html?cat=books"><img src="assets/icons/books.jpg" alt=""><span>كتب</span>‹</a>
    <a class="row" href="choose-sub.html?cat=home-garden"><img src="assets/icons/home-garden.jpg" alt=""><span>المنزل</span>‹</a>

  </div>
</body>
</html>
