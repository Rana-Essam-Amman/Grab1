<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch the deals — Publish</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f9f8f4; --card:#fff; --dark:#1a1918; --muted:#8c8982; --border:#e7e3d8; --accent:#b08931; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#ebe6db; font-family:Tajawal,Inter,sans-serif; color:#4a4845; }
    .app { max-width:430px; min-height:100vh; margin:0 auto; background:var(--bg); padding:18px 18px 40px; }
    h1 { font-family:Newsreader,Georgia,serif; font-size:26px; color:var(--dark); margin:12px 0 14px; }
    .row, select, input, textarea { width:100%; }
    .row { display:block; background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:10px; font-weight:600; }
    input, select, textarea { border:1px solid var(--border); border-radius:16px; padding:14px; background:#fff; font:inherit; margin-bottom:10px; }
    textarea { min-height:120px; }
    .cta { width:100%; height:52px; border:0; border-radius:26px; background:var(--accent); color:#fff; font-weight:700; margin-top:10px; }
    .muted { color:var(--muted); font-size:13px; margin-bottom:12px; }
    .price { color:var(--accent); font-weight:700; font-size:20px; margin:8px 0; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>
    const cities = { Amman:["Abdoun","Khalda","Sweifieh"], Irbid:["University St"], Aqaba:["Aqaba City"] };
    const draft = { city:"", area:"", site:"", make:"", model:"", year:"", km:"", inspect:"", price:"", title:"", desc:"" };
    let step = 0;
    function writeCopy() {
      draft.title = [draft.year, draft.make, draft.model].filter(Boolean).join(" ") || "إعلان سيارة";
      draft.desc = draft.title + ". ماشية " + (draft.km||"—") + " كم. الموقع: " + draft.city + " " + draft.area + " " + draft.site + ". الفحص: " + (draft.inspect||"—") + ".";
    }
    function go(n){ step=n; draw(); }
    function draw(){
      const el = document.getElementById("app");
      if(step===0){
        el.innerHTML = `<a href="photos.html">رجوع</a><h1>في أي مدينة؟</h1>` + Object.keys(cities).map(c=>`<button class="row" onclick="draft.city='${c}';go(1)">${c}</button>`).join("");
      } else if(step===1){
        el.innerHTML = `<h1>في أي منطقة (الحي)؟</h1>` + (cities[draft.city]||[]).map(a=>`<button class="row" onclick="draft.area='${a}';go(2)">${a}</button>`).join("");
      } else if(step===2){
        el.innerHTML = `<h1>في أي موقع؟</h1><input id="site" placeholder="قرب دائرة الترخيص"><button class="cta" onclick="draft.site=document.getElementById('site').value;go(3)">التالي</button>`;
      } else if(step===3){
        el.innerHTML = `<h1>المواصفات والسعر</h1>
          <input id="make" placeholder="الشركة / النوع"><input id="model" placeholder="الموديل">
          <input id="year" placeholder="سنة الصنع"><input id="km" placeholder="كم ماشية">
          <select id="inspect"><option>مفحوص</option><option>غير مفحوص</option><option>بحاجة فحص</option></select>
          <input id="price" type="number" placeholder="السعر">
          <button class="cta" onclick="draft.make=make.value;draft.model=model.value;draft.year=year.value;draft.km=km.value;draft.inspect=inspect.value;draft.price=price.value;writeCopy();go(4)">التالي</button>`;
      } else if(step===4){
        el.innerHTML = `<h1>العنوان والوصف</h1><p class="muted">اتكتبوا من إجاباتك. عدّل إذا بدك.</p>
          <input id="title" value="${draft.title}">
          <textarea id="desc">${draft.desc}</textarea>
          <button class="cta" onclick="draft.title=title.value;draft.desc=desc.value;go(5)">التالي</button>`;
      } else {
        el.innerHTML = `<h1>مراجعة قبل النشر</h1>
          <b>${draft.title}</b>
          <div class="price">${draft.price} JOD</div>
          <p>${draft.city} · ${draft.area} · ${draft.site}</p>
          <p>${draft.desc}</p>
          <button class="cta" onclick="location.href='home.html'">حفظ ونشر الإعلان</button>`;
      }
    }
    draw();
  </script>
</body>
</html>
