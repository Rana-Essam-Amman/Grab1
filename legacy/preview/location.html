<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch the deals — Location</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#ebe6db; font-family:Tajawal,sans-serif; color:#4a4845; }
    .app { max-width:430px; min-height:100vh; margin:0 auto; background:#f9f8f4; padding:18px; }
    h1 { font-family:Newsreader,Georgia,serif; font-size:26px; color:#1a1918; }
    .row { display:block; width:100%; text-align:right; background:#fff; border:1px solid #e7e3d8; border-radius:16px; padding:16px; margin:0 0 10px; font-weight:600; }
    input { width:100%; border:1px solid #e7e3d8; border-radius:16px; padding:14px; font:inherit; }
    .cta { width:100%; height:52px; margin-top:16px; border:0; border-radius:26px; background:#b08931; color:#fff; font-weight:700; }
    .muted { color:#8c8982; margin:8px 0 14px; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const book = {
      "عمّان": ["عبدون","الصويفية","خلدا","دابوق","الجبيهة","تلاع العلي","الشميساني","العبدلي","وسط البلد","ماركا","طبربور","سحاب","وادي السير","ناعور","مرج الحمام","أبو نصير","صويلح"],
      "إربد": ["إربد","شارع الجامعة","الحصن","الرمثا"],
      "الزرقاء": ["الزرقاء","الزرقاء الجديدة","الرصيفة"],
      "البلقاء": ["السلط","الفحيص","ماحص"],
      "مادبا": ["مادبا"],
      "الكرك": ["الكرك"],
      "الطفيلة": ["الطفيلة"],
      "معان": ["معان","البتراء / وادي موسى"],
      "العقبة": ["العقبة"],
      "المفرق": ["المفرق"],
      "جرش": ["جرش"],
      "عجلون": ["عجلون"]
    };
    let step = 0, city = "", area = "";
    function goNote(){
      location.href = "ai-draft.html?cat=" + encodeURIComponent(params.get("cat")||"motors") + "&sub=" + encodeURIComponent(params.get("sub")||"cars-sale") + "&city=" + encodeURIComponent(city) + "&area=" + encodeURIComponent(area);
    }
    function draw(){
      const el = document.getElementById("app");
      if(step===0){
        el.innerHTML = `<h1>في أي مدينة؟</h1>` + Object.keys(book).map(c=>`<button class="row" onclick="city='${c}';step=1;draw()">${c}</button>`).join("");
      } else if(step===1){
        el.innerHTML = `<h1>في أي حي؟</h1>` + book[city].map(a=>`<button class="row" onclick="area='${a}';step=2;draw()">${a}</button>`).join("");
      } else {
        const q = encodeURIComponent((city + " " + area).trim());
        el.innerHTML = `<h1>الموقع التقريبي</h1><p class="muted">قرب دائرة الترخيص، أو اسم الشارع.</p><input id="site" placeholder="الموقع التقريبي"><iframe title="map" src="https://maps.google.com/maps?q=${q}&hl=ar&z=14&output=embed" style="width:100%;height:180px;border:0;border-radius:18px;margin-top:12px"></iframe><button class="cta" onclick="goNote()">التالي</button>`;
      }
    }
    draw();
  </script>
</body>
</html>
