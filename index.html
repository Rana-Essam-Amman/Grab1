<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('catch_locale');
          var locale = 'ar';
          if (saved) {
            if (saved === 'en' || saved === 'ar') {
              locale = saved;
            } else {
              var parsed = JSON.parse(saved);
              locale = (parsed && parsed.state && parsed.state.locale) || 'ar';
            }
          }
          document.documentElement.setAttribute('dir', locale === 'ar' ? 'rtl' : 'ltr');
          document.documentElement.setAttribute('lang', locale);
        } catch (e) {
          document.documentElement.setAttribute('dir', 'rtl');
          document.documentElement.setAttribute('lang', 'ar');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icons/logo.png" />
    <link rel="apple-touch-icon" href="/assets/icons/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOX Marketplace</title>
    <meta name="google-site-verification" content="YxKVwBUyYcAjhc_CEwVO1mZmYYdbbuPvcBm9BfaSox8" />
    <meta name="description" content="AI-powered classifieds marketplace for the Middle East — post in seconds, buy in minutes. Available in Jordan, Lebanon, Palestine, Syria, and Saudi Arabia." />
    <meta property="og:title" content="FOX Marketplace" />
    <meta property="og:description" content="AI-powered classifieds marketplace for the Middle East — post in seconds, buy in minutes." />
    <meta property="og:image" content="/assets/icons/logo.png" />
    <link rel="dns-prefetch" href="https://wmchqotsforwcoxilaeo.supabase.co">
    <link rel="preconnect" href="https://wmchqotsforwcoxilaeo.supabase.co" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" />
    </noscript>
    <style>
      :lang(ar), [dir="rtl"] { font-family: 'IBM Plex Sans Arabic', sans-serif; }
      :lang(en), [dir="ltr"] { font-family: 'Geist', system-ui, sans-serif; }
      #boot-skeleton { max-width: 440px; margin: 0 auto; padding: 12px 16px; box-sizing: border-box; }
      #boot-skeleton .bs-bar { height: 32px; background: rgba(0,0,0,0.08); border-radius: 8px; margin-bottom: 14px; }
      #boot-skeleton .bs-search { height: 44px; background: rgba(0,0,0,0.06); border-radius: 12px; margin-bottom: 18px; }
      #boot-skeleton .bs-card { height: 150px; background: rgba(0,0,0,0.06); border-radius: 16px; margin-bottom: 12px; animation: bs-pulse 1.4s ease-in-out infinite; }
      @keyframes bs-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FOX Marketplace",
        "url": "https://fox-marketplaces.pages.dev",
        "inLanguage": ["ar", "en"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": { "@type": "EntryPoint", "urlTemplate": "https://fox-marketplaces.pages.dev/search?q={search_term_string}" },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FOX Marketplace",
        "url": "https://fox-marketplaces.pages.dev",
        "logo": "https://fox-marketplaces.pages.dev/assets/icons/logo.png",
        "areaServed": [
          { "@type": "Country", "name": "Jordan" },
          { "@type": "Country", "name": "Saudi Arabia" },
          { "@type": "Country", "name": "Lebanon" },
          { "@type": "Country", "name": "Palestine" },
          { "@type": "Country", "name": "Syria" }
        ]
      }
    </script>
  </head>
  <body class="bg-[#ebe6db] text-[#4a4845] antialiased">

      <div id="boot-skeleton" aria-hidden="true">
        <div class="bs-bar"></div>
        <div class="bs-search"></div>

        <div class="bs-card"></div>
