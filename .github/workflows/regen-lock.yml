name: Regenerate Lock File
on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: regenerate package-lock for hcaptcha dependency"
          title: "chore: regenerate package-lock for hcaptcha"
          body: "This PR updates package-lock.json to include @hcaptcha/react-hcaptcha."
          branch: "chore/regen-lock"
          delete-branch: true
