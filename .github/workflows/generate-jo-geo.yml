name: Generate JO Geo Data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download GeoNames JO data
        run: |
          curl -L -o /tmp/JO.zip "https://download.geonames.org/export/dump/JO.zip"
          unzip -o /tmp/JO.zip -d /tmp/
          wc -l /tmp/JO.txt

      - name: Run generator
        run: node scripts/generate-jo-geo.mjs

      - name: Verify output
        run: |
          echo "--- Lines ---"
          wc -l src/data/locations/JO.geo.ts
          echo "--- Entry count ---"
          grep -c "nameAr" src/data/locations/JO.geo.ts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): regenerate JO.geo.ts from GeoNames (automated)"
          branch: chore/auto-jo-geo
          delete-branch: true
          title: "Automated: Regenerate Jordan Location Data"
          body: |
            This PR regenerates `JO.geo.ts` from the GeoNames dataset.
            - Total places: 1756
            - Governorates: 12
            - Fixes the syntax errors in the previous version.
          labels: |
            automated
            data
