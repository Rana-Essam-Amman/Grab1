name: Storage Monitor

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Check Storage & Listings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run storage monitor
        id: monitor
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/storage-monitor.mjs

      - name: Open warning issue
        if: steps.monitor.outputs.criticals != '0' || steps.monitor.outputs.warnings != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const listings = '${{ steps.monitor.outputs.listings }}';
            const storageMb = '${{ steps.monitor.outputs.storage_mb }}';
            const summary = '${{ steps.monitor.outputs.summary }}';
            const isCritical = '${{ steps.monitor.outputs.criticals }}' !== '0';
            const emoji = isCritical ? '🔴' : '🟠';
            const title = `${emoji} Storage Alert: ${summary}`;
            const body = [
              '## Storage Monitor Report',
              '',
              `**Listings:** ${listings}`,
              `**Storage:** ${storageMb} MB`,
              '',
              '### Alerts',
              summary.split(' | ').map((a) => `- ${a}`).join('\n'),
              '',
              '### Recommended actions',
              isCritical
                ? '- 🔴 **Upgrade Supabase tier NOW** (Pro plan $25/month)'
                : '- 🟠 Review storage and plan upgrade soon',
              '- Check dashboard: https://supabase.com/dashboard/project/wmchqotsforwcoxilaeo/settings/billing',
              '',
              '---',
              '_Auto-generated by storage-monitor.yml_',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['infra', 'monitoring'],
            });

      - name: Fail workflow on critical
        if: steps.monitor.outputs.criticals != '0'
        run: |
          echo "::error::Storage critical threshold exceeded. Check the issue for details."
          exit 1
